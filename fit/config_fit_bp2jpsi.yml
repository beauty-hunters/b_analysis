         /home/fgrosa/analysis_b2jpsi/b_analysis/ML/ML/application/LHC26_skimmed_pass1_BpToJPsi_pT_5_8_ModelApplied.parquet.gzip,
         /home/fgrosa/analysis_b2jpsi/b_analysis/ML/ML/application/LHC26_skimmed_pass1_BpToJPsi_pT_8_100_ModelApplied.parquet.gzip,
         /home/fgrosa/analysis_b2jpsi/b_analysis/ML/ML/application/LHC25_skimmed_pass1_BpToJPsi_pT_2_5_ModelApplied.parquet.gzip,
         /home/fgrosa/analysis_b2jpsi/b_analysis/ML/ML/application/LHC25_skimmed_pass1_BpToJPsi_pT_5_8_ModelApplied.parquet.gzip,
         /home/fgrosa/analysis_b2jpsi/b_analysis/ML/ML/application/LHC25_skimmed_pass1_BpToJPsi_pT_8_100_ModelApplied.parquet.gzip]
  data_mass_shifts: [0., 0., 0., 0.022, 0.022, 0.022]
  mc: [ /home/fgrosa/analysis_b2jpsi/b_analysis/ML/ML/application/LHC26f10_f11_BpToJPsi_pT_2_5_ModelApplied.parquet.gzip,
        /home/fgrosa/analysis_b2jpsi/b_analysis/ML/ML/application/LHC26f10_f11_BpToJPsi_pT_5_8_ModelApplied.parquet.gzip,
        /home/fgrosa/analysis_b2jpsi/b_analysis/ML/ML/application/LHC26f10_f11_BpToJPsi_pT_8_100_ModelApplied.parquet.gzip]
  b_to_dk: []
cutset_file_name: '/home/fgrosa/analysis_b2jpsi/b_analysis/config/cutset_bp2jpsi.yml'

zfit_n_cpus:
  intra: 10
  inter: 10

fit_configs:
  reference_file_for_fix_sigma_mean: null
  shift_bkg_templ: 0.0        # numerical value or null
  pt_int:
    activate: true
    extended: true
    signal_funcs: ["gaussian"]
    bkg_funcs: ["chebpol2"]
    mass_limits: [4.90, 5.6]
    use_bkg_templ: true
    bkg_templ_opt: 0 # 0 -> all separated, 1 -> weighted average
    fix_correlated_bkg_to_signal: true
  # below one per pT bin
  extended: [false, false, false, false, false, false, false]
  signal_funcs: [["gaussian"], ["gaussian"], ["gaussian"], ["gaussian"], ["gaussian"], ["gaussian"], ["gaussian"]]
  bkg_funcs: [["chebpol2"], ["chebpol2"], ["chebpol2"], ["chebpol2"], ["chebpol2"], ["chebpol2"], ["chebpol2"]]
  mass_limits: [[4.90, 5.6], [4.90, 5.6], [4.90, 5.6], [4.90, 5.6], [4.90, 5.6], [4.90, 5.6], [4.90, 5.6]]
  use_bkg_templ: [true, true, true, true, true, true, true]
  bkg_templ_opt: [1, 1, 1, 1, 1, 1, 1] # 0 -> all separated, 1 -> weighted average
  correlated_bkgs:
    - name: '$\mathrm{B^{0} \rightarrow J/\Psi X}$'
      beauty_id: null
      charm_id: null
      br_pdg: 1.
      br_sim: 1.
      flag: 7
    - name: '$\mathrm{B_{s}^{0} \rightarrow J/\Psi X}$'
      beauty_id: null
      charm_id: null
      br_pdg: 1.
      br_sim: 1.
      flag: 10

  signal_br:
    pdg: 1
    sim: 1

  fix_correlated_bkg_to_signal: [true, true, true, true, true, true, true]
  fix_mean: false # bool or list of bool
  fix_sigma: false # bool or list of bool

plot_style:
  pt_int:
    n_bins: 76
  n_bins: [76, 76, 76, 76, 76, 76, 76]
  system: pp
  energy: "13.6"
  extra_info_loc: ["center right", "center left"]

outputs:
  directory: "/home/fgrosa/analysis_b2jpsi/b_analysis/fit/outputs/BpToJPsi"
  suffix: "_LHC25_LHC26_pp_BpToJPsi"
  produce_sweights: false

